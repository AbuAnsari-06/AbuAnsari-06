<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation">
  <defs>
    <linearGradient id="div-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="52%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Horizontal Laser Rail -->
  <line x1="0" y1="12" x2="1000" y2="12" stroke="url(#div-laser)" stroke-width="1.2"/>

  <!-- Center Architecture Node -->
  <g transform="translate(500, 12)">
    <!-- Outer Node Frame -->
    <rect x="-18" y="-7" width="36" height="14" rx="2" fill="#07090e" stroke="#334155" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
    
    <!-- Micro coordinate marks -->
    <line x1="-30" y1="-3" x2="-30" y2="3" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="-3" x2="30" y2="3" stroke="#475569" stroke-width="1"/>
  </g>
</svg>
