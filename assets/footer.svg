<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="presentation">
  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="laser-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="80" fill="url(#footer-bg)"/>

  <!-- Top Laser Boundary -->
  <line x1="0" y1="1" x2="1000" y2="1" stroke="url(#laser-line)" stroke-width="1.5"/>

  <!-- Perspective Floor Grid converging to distance -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.45">
    <line x1="500" y1="0" x2="100" y2="80"/>
    <line x1="500" y1="0" x2="250" y2="80"/>
    <line x1="500" y1="0" x2="400" y2="80"/>
    <line x1="500" y1="0" x2="600" y2="80"/>
    <line x1="500" y1="0" x2="750" y2="80"/>
    <line x1="500" y1="0" x2="900" y2="80"/>
    <line x1="0" y1="30" x2="1000" y2="30"/>
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="75" x2="1000" y2="75"/>
  </g>

  <!-- Centered Terminal Stamp -->
  <g transform="translate(500, 42)">
    <rect x="-85" y="-12" width="170" height="24" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="-68" cy="0" r="2.5" fill="#10b981"/>
    <text x="-56" y="4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5">// END_OF_TRANSMISSION</text>
  </g>
</svg>
