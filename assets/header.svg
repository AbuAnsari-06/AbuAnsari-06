<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Abu Horairah Ansari - Backend, DevOps, AI/ML Research">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1A16"/>
      <stop offset="0.5" stop-color="#1C4033"/>
      <stop offset="0.82" stop-color="#B8893A"/>
      <stop offset="1" stop-color="#E3B95C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6DE9B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F6DE9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lattice" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M22 4 L40 22 L22 40 L4 22 Z" fill="none" stroke="#C9A24B" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="22" cy="22" r="1.6" fill="#C9A24B" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07120E"/>
      <stop offset="0.5" stop-color="#0E211A"/>
      <stop offset="1" stop-color="#07120E"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6DE9B"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
    <style>
      .sun-glow { transform-origin: 500px 200px; animation: breathe 7s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @media (prefers-reduced-motion: reduce) { .sun-glow { animation: none; } }
      .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- sky seen through the arch -->
  <rect width="1000" height="260" fill="url(#sky)"/>
  <g fill="#F6E7B8">
    <circle cx="455" cy="92" r="1.3" opacity=".8"/><circle cx="545" cy="70" r="1.1" opacity=".7"/>
    <circle cx="500" cy="58" r="1.6" opacity=".9"/><circle cx="420" cy="140" r="1" opacity=".5"/>
    <circle cx="582" cy="128" r="1" opacity=".5"/>
  </g>
  <circle class="sun-glow" cx="500" cy="200" r="120" fill="url(#glow)"/>
  <circle cx="500" cy="204" r="42" fill="#F2D58A"/>
  <!-- dunes -->
  <path d="M340 260 V226 Q420 204 500 220 T660 214 V260 Z" fill="#0F2A22"/>
  <path d="M340 260 V240 Q430 226 520 238 T660 236 V260 Z" fill="#0A1C16"/>

  <!-- wall with pointed arch opening (even-odd cut-out) -->
  <path fill-rule="evenodd" fill="url(#wall)" d="M0 0H1000V260H0Z M380 260V132Q380 72 500 30Q620 72 620 132V260Z"/>
  <path fill-rule="evenodd" fill="url(#lattice)" d="M0 0H1000V260H0Z M380 260V132Q380 72 500 30Q620 72 620 132V260Z"/>
  <path d="M380 260V132Q380 72 500 30Q620 72 620 132V260" fill="none" stroke="#C9A24B" stroke-width="2.5"/>
  <path d="M364 260V130Q364 62 500 14Q636 62 636 130V260" fill="none" stroke="#C9A24B" stroke-opacity=".35" stroke-width="1"/>

  <!-- Left Side: Name and Identity -->
  <text x="50" y="80" class="sub-text" font-size="11" fill="#C9A24B" letter-spacing="3.5" text-transform="uppercase">PORTFOLIO // SYSTEMS &amp; AI</text>
  <text x="50" y="125" class="title-name" font-size="34" fill="url(#gold-text)" letter-spacing="1">ABU HORAIRAH</text>
  <text x="50" y="165" class="title-name" font-size="34" fill="#FFFFFF" letter-spacing="1">ANSARI</text>
  <rect x="50" y="185" width="260" height="1.5" fill="#C9A24B" opacity="0.4"/>
  <text x="50" y="210" class="sub-text" font-size="13" fill="#8DB88F" letter-spacing="2">BACKEND · DEVOPS · AI/ML</text>

  <!-- Right Side: Academic & Specialization -->
  <text x="950" y="80" text-anchor="end" class="sub-text" font-size="11" fill="#C9A24B" letter-spacing="3.5">PSIT KANPUR '27</text>
  <text x="950" y="120" text-anchor="end" class="title-name" font-size="20" fill="#FFFFFF" letter-spacing="1">B.TECH CSE (AI/ML)</text>
  <text x="950" y="150" text-anchor="end" class="sub-text" font-size="14" fill="#8DB88F" letter-spacing="1.5">Distributed Backends</text>
  <text x="950" y="174" text-anchor="end" class="sub-text" font-size="14" fill="#8DB88F" letter-spacing="1.5">Empirical LLM Research</text>
  <text x="950" y="210" text-anchor="end" class="sub-text" font-size="12" fill="#F6DE9B" letter-spacing="2">OPEN FOR INTERNSHIPS</text>
</svg>
