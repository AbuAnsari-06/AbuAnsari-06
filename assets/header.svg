<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Abu Horairah Ansari - Systems Architecture, Backend, DevOps, AI/ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>

    <linearGradient id="silver-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="laser-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="node-pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .pulse-node { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
      .data-packet { animation: flow 4s linear infinite; }
      @keyframes flow { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse-node, .data-packet { animation: none; } }
      .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Deep Matte Background -->
  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- Perspective Systems Network Grid -->
  <rect width="1000" height="260" fill="url(#grid)"/>

  <!-- Circuit Trace / Data Pipelines -->
  <g stroke="#334155" stroke-width="1.2" fill="none" opacity="0.6">
    <!-- Trace lines connecting nodes -->
    <path d="M 400 40 L 480 40 L 520 80 L 680 80 L 710 110 L 850 110" />
    <path d="M 420 180 L 500 180 L 540 140 L 660 140 L 700 180 L 820 180" />
    <path d="M 680 80 L 720 40 L 880 40" />
    <path d="M 520 80 L 560 120 L 560 200 L 620 230" />
    <path d="M 750 110 L 750 190 L 790 220" />
  </g>

  <!-- Animated Data Pulses -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
    <path class="data-packet" stroke-dasharray="20 120" d="M 400 40 L 480 40 L 520 80 L 680 80 L 710 110 L 850 110" />
    <path class="data-packet" stroke-dasharray="30 140" d="M 420 180 L 500 180 L 540 140 L 660 140 L 700 180 L 820 180" />
    <path class="data-packet" stroke-dasharray="15 90" d="M 680 80 L 720 40 L 880 40" />
  </g>

  <!-- Modern Server Nodes (Isometric Clusters on the Right) -->
  <g transform="translate(680, 50)">
    <!-- Node 1: Primary Controller -->
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="42" rx="1" fill="#38bdf8"/>
    <text x="14" y="18" class="mono-txt" font-size="9" fill="#94a3b8" letter-spacing="1">NODE // 01</text>
    <text x="14" y="32" class="mono-txt" font-size="11" font-weight="700" fill="#f8fafc">QUEUE_WORKER</text>
    <circle cx="116" cy="21" r="3.5" fill="#38bdf8" class="pulse-node"/>

    <!-- Node 2: Database / Persistence -->
    <rect x="60" y="60" width="130" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="60" y="60" width="4" height="42" rx="1" fill="#e2e8f0"/>
    <text x="74" y="78" class="mono-txt" font-size="9" fill="#94a3b8" letter-spacing="1">NODE // 02</text>
    <text x="74" y="92" class="mono-txt" font-size="11" font-weight="700" fill="#f8fafc">POSTGRES_REPLICA</text>
    <circle cx="176" cy="81" r="3.5" fill="#10b981"/>

    <!-- Node 3: AI Inference MoE Router -->
    <rect x="20" y="120" width="130" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="20" y="120" width="4" height="42" rx="1" fill="#818cf8"/>
    <text x="34" y="138" class="mono-txt" font-size="9" fill="#94a3b8" letter-spacing="1">NODE // 03</text>
    <text x="34" y="152" class="mono-txt" font-size="11" font-weight="700" fill="#f8fafc">ROUTER_GATEWAY</text>
    <circle cx="136" cy="141" r="3.5" fill="#818cf8" class="pulse-node"/>

    <!-- Telemetry status tags -->
    <g class="mono-txt" font-size="8" fill="#64748b">
      <text x="210" y="35">ACK: 200 OK</text>
      <text x="210" y="75">LATENCY: 8ms</text>
      <text x="210" y="135">SYNC: 99.98%</text>
    </g>
  </g>

  <!-- Subtle Ambient Glow -->
  <circle cx="750" cy="110" r="140" fill="#38bdf8" opacity="0.04" filter="blur(40px)"/>

  <!-- Decorative HUD Corner Marks -->
  <g stroke="#475569" stroke-width="1" fill="none">
    <path d="M 20 35 L 20 20 L 35 20"/>
    <path d="M 980 35 L 980 20 L 965 20"/>
    <path d="M 20 225 L 20 240 L 35 240"/>
    <path d="M 980 225 L 980 240 L 965 240"/>
  </g>

  <!-- Left Side: Engineering Identity -->
  <g transform="translate(45, 0)">
    <!-- Top System Architecture Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="14" height="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="7" cy="7" r="2.5" fill="#38bdf8"/>
      <text x="24" y="11" class="mono-txt" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="2">SYSTEMS &amp; EMPIRICAL AI</text>
    </g>

    <!-- Full Name in High-Contrast Silver Typography -->
    <text x="0" y="108" class="sans-txt" font-size="34" font-weight="900" fill="url(#silver-grad)" letter-spacing="1.5">ABU HORAIRAH</text>
    <text x="0" y="148" class="sans-txt" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="1.5">ANSARI</text>

    <!-- Laser Divider line -->
    <line x1="0" y1="168" x2="380" y2="168" stroke="#334155" stroke-width="1.5"/>
    <circle cx="0" cy="168" r="2.5" fill="#38bdf8"/>
    <line x1="0" y1="168" x2="140" y2="168" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Discipline & Subhead -->
    <text x="0" y="194" class="sans-txt" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="2">BACKEND · DEVOPS · AI/ML RESEARCH</text>
    <text x="0" y="215" class="mono-txt" font-size="10.5" fill="#64748b" letter-spacing="1">PSIT KANPUR '29 · B.TECH CSE (AI/ML) · OPEN FOR INTERNSHIPS</text>
  </g>

  <!-- Top Laser Glow Accent Line -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#laser-glow)"/>
  <!-- Bottom Edge Accent -->
  <line x1="0" y1="259" x2="1000" y2="259" stroke="#1e293b" stroke-width="1"/>
</svg>
